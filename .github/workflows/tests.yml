# The tests, on every push and pull request. No secrets: everything is faked.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["state/**"] # (The digest's own progress commits.)
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
